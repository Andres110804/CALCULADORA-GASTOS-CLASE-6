<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Calculadora de gastos</h1>
        <section class="card"> 
            <h2>Meta de gasto</h2>
            <label for="budgetInput">Meta total($):</label>
            <input type="number" id="budgetInput" placeholder="Ej. 500">
            <button id="setBudgetBtn">Establecer meta</button>
            <p id="budgetDisplay">Meta actual: $0</p>
        </section>

        <section class="card">
            <h2>Agregar gasto</h2>
            <input type="number" id="amountInput" placeholder="Ej. 150">
            <label for="categoryInput">Categoria</label>
            <div class="select-wrapped">
                            <select id="categoryInput">
                <option value="" disabled selected>Selecciona una categoria</option>
                <option value="Comida">Comida</option>
                <option value="Transporte">Transporte</option>
                <option value="Ocio">Ocio</option>
                <option value="Otros">Otros</option>
            </select>
            </div>


            <button id="addExpenseBtn">Agregar gasto</button>

            <p id="errorMessage" class="Error"></p>

        </section>

        <section class="card">
            <h2>Gastos registrados</h2>
            <ul id="expensesList">

            </ul>
        </section>
    </main>

    <section class="card">
        <h2>Resumen</h2>
        <p id="totalDisplay">Total gastado: 0$</p>
        <p id="statusDisplay">Estado: sin meta definida</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
